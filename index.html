<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cute Teddy ❤️</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #ffd1dc;
}
h1 {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  color: white;
  font-family: Arial;
  z-index: 10;
}
.blur {
  filter: blur(8px);
}
</style>
</head>

<body>

<h1>Touch Me 🧸</h1>

<button id="noteBtn" style="
position:absolute;
top:20px;
right:20px;
z-index:20;
padding:8px 14px;
border:none;
border-radius:15px;
background:#ff4f81;
color:white;
cursor:pointer;">
Open Note 💌
</button>

<button id="muteBtn" style="
position:absolute;
top:20px;
left:20px;
z-index:20;
padding:8px 14px;
border:none;
border-radius:15px;
background:#555;
color:white;
cursor:pointer;">
🔊
</button>

<h2 id="loveMessage" style="
position:absolute;
top:80px;
width:100%;
text-align:center;
color:white;
font-family:Arial;
opacity:0;
transform:scale(0.8);
transition:opacity 1s, transform 1s;">
Cutie Teddy For My Love ❤️
</h2>

<div id="secretNote" style="
position:absolute;
top:50%;
left:50%;
transform:translate(-50%, -50%);
background:white;
padding:25px;
border-radius:20px;
width:80%;
max-width:350px;
text-align:center;
font-family:Arial;
display:none;
z-index:30;">
<h3>💌 A Special Message</h3>
<p>You are the cutest part of my life.  
Thank you for existing ❤️</p>
<button onclick="toggleNote()" style="
margin-top:15px;
padding:8px 14px;
border:none;
border-radius:15px;
background:#ff4f81;
color:white;
cursor:pointer;">
Close
</button>
</div>

<audio id="bgMusic" src="music.mp3" loop></audio>
<audio id="squeakSound" src="squeak.mp3"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/DRACOLoader.js"></script>

<script>

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffd1dc);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth / window.innerHeight,
0.1,
1000
);

camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
scene.add(light);

// Controls (FIXED)
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.enableZoom = false; // disable zoom
controls.enableRotate = false; // we rotate manually

// Loader
const loader = new THREE.GLTFLoader();
const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath("https://www.gstatic.com/draco/v1/decoders/");
loader.setDRACOLoader(dracoLoader);

let teddy;

loader.load("teddy_bear.glb", function(gltf) {
  teddy = gltf.scene;
  teddy.scale.set(2.3,2.3,2.3);
  teddy.position.set(0,-1.5,0);
  teddy.rotation.y = -Math.PI/2;
  scene.add(teddy);
});

// Animate
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();


// AXIS ROTATION
let isDragging = false;
let previousX = 0;

renderer.domElement.addEventListener("pointerdown", e=>{
  if(noteOpen) return;
  isDragging = true;
  previousX = e.clientX;
});

renderer.domElement.addEventListener("pointermove", e=>{
  if(!isDragging || !teddy || noteOpen) return;
  const deltaX = e.clientX - previousX;
  teddy.rotation.y += deltaX * 0.01;
  previousX = e.clientX;
});

renderer.domElement.addEventListener("pointerup", ()=>{
  isDragging = false;
});


// SQUEEZE SYSTEM
let clickCount = 0;

renderer.domElement.addEventListener("pointerup", (e)=>{

  if(noteOpen) return;
  if(!teddy) return;
  if(isDragging) return;

  clickCount++;

  const squeak = document.getElementById("squeakSound");
  squeak.currentTime = 0;
  squeak.play();

  teddy.scale.set(2.4,1.5,2.4);
  setTimeout(()=>teddy.scale.set(2.2,2.6,2.2),120);
  setTimeout(()=>teddy.scale.set(2.3,2.3,2.3),250);

  if(clickCount === 3){
    const msg = document.getElementById("loveMessage");
    msg.style.opacity = "1";
    msg.style.transform = "scale(1)";
    document.getElementById("bgMusic").play();

    // Hug zoom
    let zoomInterval = setInterval(()=>{
      camera.position.z -= 0.05;
      if(camera.position.z <= 3){
        clearInterval(zoomInterval);
      }
    },16);
  }
});


// NOTE SYSTEM
let noteOpen = false;

function toggleNote(){
  if(!teddy) return;

  noteOpen = !noteOpen;

  const note = document.getElementById("secretNote");
  const canvas = renderer.domElement;
  const header = document.querySelector("h1");

  if(noteOpen){
    teddy.rotation.y += Math.PI;
    canvas.classList.add("blur");
    header.classList.add("blur");
    note.style.display="block";
  }else{
    teddy.rotation.y -= Math.PI;
    canvas.classList.remove("blur");
    header.classList.remove("blur");
    note.style.display="none";
  }
}

document.getElementById("noteBtn").addEventListener("click", toggleNote);


// MUTE
const bgMusic = document.getElementById("bgMusic");
const muteBtn = document.getElementById("muteBtn");

muteBtn.addEventListener("click", ()=>{
  bgMusic.muted = !bgMusic.muted;
  muteBtn.innerText = bgMusic.muted ? "🔇" : "🔊";
});


// Resize
window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
