<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cute Teddy ❤️</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #ffd1dc;
    }
    h1 {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial;
      z-index: 10;
    }
    .blur {
  filter: blur(8px);
}

  </style>
</head>
<body>

<!-- ✅ INTRO SCREEN -->
<div id="introScreen" style="
position:fixed;
width:100%;
height:100%;
background:#ffd1dc;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
font-family:Arial;
text-align:center;
">
<h1>3D Teddy Surprise 🧸</h1>
<p>Enter your surprise code to continue ❤️</p>
<button onclick="startExperience()" style="
padding:12px 25px;
border:none;
border-radius:20px;
background:#ff4f81;
color:white;
font-size:16px;
cursor:pointer;
">Enter</button>
</div>

<h1>Touch Me 🧸</h1>
<button id="noteBtn" style="
position:absolute;
top:20px;
right:20px;
z-index:20;
padding:8px 14px;
border:none;
border-radius:15px;
background:#ff4f81;
color:white;
cursor:pointer;
">
Open Note 💌
</button>

<button id="muteBtn" style="
position:absolute;
top:20px;
left:20px;
z-index:20;
padding:8px 14px;
border:none;
border-radius:15px;
background:#555;
color:white;
cursor:pointer;
">
🔊
</button>


<h2 id="loveMessage" style="
position:absolute;
top:80px;
width:100%;
text-align:center;
color:white;
font-family:Arial;
opacity:0;
transform:scale(0.8);
transition:opacity 1s, transform 1s;
">
Cutie Teddy For My Love ❤️
</h2>
  
  <div id="secretNote" style="
position:absolute;
top:50%;
left:50%;
transform:translate(-50%, -50%);
background:white;
padding:25px;
border-radius:20px;
width:80%;
max-width:350px;
text-align:center;
font-family:Arial;
display:none;
z-index:30;
">
<h3>💌 A Special Message</h3>
<p>
You are the cutest part of my life.  
Thank you for existing ❤️
</p>
<button onclick="toggleNote()" style="
margin-top:15px;
padding:8px 14px;
border:none;
border-radius:15px;
background:#ff4f81;
color:white;
cursor:pointer;
">
Close
</button>
</div>


<audio id="bgMusic" src="music.mp3" loop></audio>
<audio id="squeakSound" src="squeak.mp3"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/DRACOLoader.js"></script>

<script>

// 🔒 LOCK VARIABLE
let isUnlocked = false;

// ✅ PASSWORD PROTECTION
function startExperience() {
  const password = prompt("Enter your surprise code ❤️");

  if (password !== "LOVE2026") {   // 👈 change per customer
    alert("Wrong code ❤️");
    return;
  }

  isUnlocked = true; // ✅ unlock everything
  document.getElementById("introScreen").style.display = "none";
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffd1dc);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
scene.add(light);

camera.position.set(0, 0, 5);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 3;   // minimum zoom-in
controls.maxDistance = 6;   // maximum zoom-out


const loader = new THREE.GLTFLoader();
const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath("https://www.gstatic.com/draco/v1/decoders/");
loader.setDRACOLoader(dracoLoader);

let teddy;

loader.load(
  "teddy_bear.glb",
  function (gltf) {
    teddy = gltf.scene;

    teddy.scale.set(2.3, 2.3, 2.3);
    teddy.position.set(0, -1.5, 0);
    teddy.rotation.y = -Math.PI / 2;
    controls.minPolarAngle = Math.PI / 3;
    controls.maxPolarAngle = Math.PI / 1.8;


    scene.add(teddy);

  },
  undefined,
  function (error) {
    console.error("Model load error:", error);
  }
);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();

function createHeart() {
  const heart = document.createElement("div");
  heart.innerHTML = "💖";
  heart.style.position = "absolute";
  heart.style.left = Math.random() * window.innerWidth + "px";
  heart.style.top = window.innerHeight + "px";
  heart.style.fontSize = "24px";
  heart.style.animation = "floatUp 3s linear forwards";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 3000);
}

const style = document.createElement("style");
style.innerHTML = `
  @keyframes floatUp {
    to {
      transform: translateY(-100vh);
      opacity: 0;
    }
  }`;
document.head.appendChild(style);

let clickCount = 0;

let startX = 0;
let startY = 0;
let isDragging = false;

renderer.domElement.addEventListener("pointerdown", (e) => {
  startX = e.clientX;
  startY = e.clientY;
  isDragging = false;
});

renderer.domElement.addEventListener("pointermove", (e) => {
  const moveX = Math.abs(e.clientX - startX);
  const moveY = Math.abs(e.clientY - startY);

  if (moveX > 6 || moveY > 6) {
    isDragging = true;
  }
});

renderer.domElement.addEventListener("pointerup", () => {

  if (!isUnlocked) return;
  if (noteOpen) return;
  if (!teddy) return;
  if (isDragging) return; // If user was rotating, don't squeeze

  clickCount++;

  const squeak = document.getElementById("squeakSound");
  squeak.currentTime = 0;
  squeak.play();

  teddy.scale.set(2.4, 1.5, 2.4);
  setTimeout(() => {
    teddy.scale.set(2.2, 2.6, 2.2);
  }, 120);
  setTimeout(() => {
    teddy.scale.set(2.4, 2.4, 2.4);
  }, 250);

  if (clickCount === 3) {
    const msg = document.getElementById("loveMessage");
    msg.style.opacity = "1";
    msg.style.transform = "scale(1)";

    document.getElementById("bgMusic").play();
    setInterval(createHeart, 300);

    let zoomInterval = setInterval(() => {
      camera.position.z -= 0.05;
      if (camera.position.z <= 3) clearInterval(zoomInterval);
    }, 16);
  }
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

  let noteOpen = false;

function toggleNote() {
  if (!isUnlocked) return;
  if (!teddy) return;

  noteOpen = !noteOpen;

  const note = document.getElementById("secretNote");
  const canvas = renderer.domElement;
  const header = document.querySelector("h1");

  if (noteOpen) {

    // Disable rotation
    controls.enabled = false;

    // Rotate teddy to back
    teddy.rotation.y += Math.PI;

    // Blur background
    canvas.classList.add("blur");
    header.classList.add("blur");

    note.style.display = "block";

  } else {

    // Enable rotation again
    controls.enabled = true;

    // Rotate teddy back to front
    teddy.rotation.y -= Math.PI;

    canvas.classList.remove("blur");
    header.classList.remove("blur");

    note.style.display = "none";
  }
}

document.getElementById("noteBtn").addEventListener("click", toggleNote);

// 🔊 MUTE BUTTON LOGIC
const bgMusic = document.getElementById("bgMusic");
const muteBtn = document.getElementById("muteBtn");

muteBtn.addEventListener("click", () => {
  bgMusic.muted = !bgMusic.muted;
  muteBtn.innerText = bgMusic.muted ? "🔇" : "🔊";
});

</script>


</body>
</html>
